<h1>Inscrivez-vous</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">S'inscrire</button>
  <button type="submit">Retourner</button>
</form>

<!-- Nous passons un argument à la balise url : 'login'
C'est comme passer des arguments à une fonction Python, 
mais dans les balises de gabarits, 
et nous n'avons pas besoin de saisir les parenthèses.-->
<p><a href="{% url 'login' %}">Déjà un compte ? Se connecter</a></p>
